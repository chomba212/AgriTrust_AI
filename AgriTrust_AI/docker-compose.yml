services:
  backend:
    build:
      context: ./backend
    environment:
      FLASK_ENV: production
      OPEN_METEO_FORECAST_URL: https://api.open-meteo.com/v1/forecast
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    depends_on:
      - backend
    ports:
      - "8080:80"
